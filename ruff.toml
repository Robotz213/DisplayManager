target-version = "py314"
preview = true
extend-include = ["*.ipynb"]
line-length = 72
indent-width = 4
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".github/instructions",
    "__pycache__",
    "build",
    "dist",
    "erros_ruff",
    "typings",
    "subgenerator.py",

]

[lint]
select = ["ALL"]
ignore = [
    "ARG",
    "CPY",
    "COM",
    "D203",
    "D213",
    "E",
    "EM",
    "FBT",
    "PLC",
    "PLR",
    "PT",
    "PYI",
    "RUF",
    "S",
    "DOC",
    "TRY",
    "UP",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.extend-per-file-ignores]
"**/{tests,docs,tools}/*" = ["E402", "S", "D100", "D104", "ANN", "D417", "N818"]
"scripts/**/*" = ["S", "BLE", "T201"]
"./typings/**/*.pyi" = ["UP", "E", "ANN", "TD", "N", "FIX", "A", "PYI047"]
"./subgenerator.py" = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 72
