[project]
name = "display-manager"
version = "0.1.1"
description = "Gerenciador de display X (Linux)"
readme = "README.md"
authors = [{ name = "Robotz213", email = "nicholasazs213@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["psutil>=7.2.2"]

[project.scripts]
display-manager = "display_manager.main:main"


[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-crawjud = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["display_manager*"]
