[project]
name = "DisplayManager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Robotz213", email = "nicholasazs213@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["psutil>=7.2.2"]

[project.scripts]
DisplayManager = "DisplayManager:main"


[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-crawjud = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["DisplayManager*"]
